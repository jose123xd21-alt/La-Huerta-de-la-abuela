<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6d3d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="La Huerta" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>La Huerta de la Abuela</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="seasonLabel">Huerto 2026</p>
        <h1 id="pageTitle">La Huerta de la Abuela</h1>
        <p class="date" id="todayDate"></p>
      </div>
      <button id="searchBtn" class="icon-btn" aria-label="Buscar">🔎</button>
    </header>

    <main id="mainContent" class="main-content"></main>

    <button id="fab" class="fab" aria-label="Añadir registro">+</button>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button data-route="home" class="nav-item active"><span>🏡</span><small>Inicio</small></button>
      <button data-route="crops" class="nav-item"><span>🌱</span><small>Cultivos</small></button>
      <button data-route="calendar" class="nav-item"><span>📅</span><small>Calendario</small></button>
      <button data-route="notebook" class="nav-item"><span>📖</span><small>Cuaderno</small></button>
      <button data-route="more" class="nav-item"><span>☰</span><small>Más</small></button>
    </nav>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <section id="modal" class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button id="closeModal" class="icon-btn" aria-label="Cerrar">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </section>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
